<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV en Vivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TV en Vivo</h1>
    <input type="text" id="searchInput" placeholder="Buscar canal...">
    <nav class="categories">
      <button onclick="filterChannels('all')">Todos</button>
      <button onclick="filterChannels('deportes')">Deportes</button>
      <button onclick="filterChannels('noticias')">Noticias</button>
      <button onclick="filterChannels('series')">Series</button>
    </nav>
  </header>

  <main class="channel-grid" id="channelGrid">
    <a href="player.html?canal=https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" class="channel-card deportes">
      <img src="https://static.vecteezy.com/system/resources/thumbnails/022/636/380/small_2x/disney-logo-disney-icon-transparent-free-png.png" />
      <div class="channel-info">DISNEY PLUS</div>
    </a>

    <a href="player.html?canal=https://moiptvhls-i.akamaihd.net/hls/live/652316/channel1/master.m3u8" class="channel-card noticias">
      <img src="img/ESPN.png" alt="ESPN" />
      <div class="channel-info">ESPN</div>
    </a>

    <a href="player.html?canal=https://linear304-gb-hls1-prd-ak.cdn.skycdp.com/306/8062.m3u8" class="channel-card series">
      <img src="img/ESPN_2.png" alt="ESPN 2" />
      <div class="channel-info">ESPN 2</div>
    </a>
    
    <a href="player.html?canal=https://linear304-gb-hls1-prd-ak.cdn.skycdp.com/306/8062.m3u8" class="channel-card series">
      <img src="img/ESPN_3.png" alt="DSPORTS" />
      <div class="channel-info">DSPORTS</div>
    </a>
    
    <a href="player.html?canal=https://linear304-gb-hls1-prd-ak.cdn.skycdp.com/306/8062.m3u8" class="channel-card series">
      <img src="img/DSports.png" alt="DSPORTS" />
      <div class="channel-info">DSPORTS</div>
    </a>
    
    <a href="player.html?canal=https://linear304-gb-hls1-prd-ak.cdn.skycdp.com/306/8062.m3u8" class="channel-card series">
      <img src="img/DSports_2.png" alt="DSPORTS 2" />
      <div class="channel-info">DSPORTS 2</div>
    </a>
    
    <a href="player.html?canal=https://linear304-gb-hls1-prd-ak.cdn.skycdp.com/306/8062.m3u8" class="channel-card series">
      <img src="img/DSports_Plus.png" alt="DSPORTS +" />
      <div class="channel-info">DSPORTS +</div>
    </a>

    <!-- Agrega más canales aquí -->
  </main>

  <footer>
    <p>&copy; 2025 TV en Vivo - Diseñado para ti</p>
  </footer>

  <script>
    function filterChannels(category) {
      const cards = document.querySelectorAll(".channel-card");
      cards.forEach(card => {
        if (category === "all" || card.classList.contains(category)) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      });
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      document.querySelectorAll(".channel-card").forEach(card => {
        const text = card.querySelector(".channel-info").textContent.toLowerCase();
        card.style.display = text.includes(value) ? "flex" : "none";
      });
    });
  </script>
</body>
</html>
