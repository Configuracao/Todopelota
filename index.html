<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Canales JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            font-size: 1em;
        }
        label {
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            color: white;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        .agregar { background-color: #28a745; }
        .reiniciar { background-color: #dc3545; }
        .copiar { background-color: #007bff; }
        pre {
            background: #000;
            color: #0f0;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <h2>Generador de Canales (con ID automático)</h2>

    <div class="form-group">
        <label for="name">Nombre del canal:</label>
        <input type="text" id="name" value="">
    </div>

    <div class="form-group">
        <label for="category">Categoría (una o varias separadas por coma):</label>
        <input type="text" id="category" value="">
    </div>

    <div class="form-group">
        <label for="logo">URL del logo:</label>
        <input type="text" id="logo" value="">
    </div>

    <div class="form-group">
        <label for="href">Enlace embed:</label>
        <input type="text" id="href" value="">
    </div>

    <button class="agregar" onclick="generarJSON()">Agregar canal</button>
    <button class="reiniciar" onclick="reiniciar()">Reiniciar</button>
    <button class="copiar" onclick="copiarAlPortapapeles()">Copiar al portapapeles</button>

    <pre id="resultado">[]</pre>

    <script>
        let idActual = 1;
        let canales = [];

        function generarJSON() {
            const name = document.getElementById("name").value.trim();
            const category = document.getElementById("category").value.split(",").map(c => c.trim());
            const logo = document.getElementById("logo").value.trim();
            const href = document.getElementById("href").value.trim();

            if (!name || !category || !logo || !href) {
                alert("Todos los campos son obligatorios.");
                return;
            }

            const canal = {
                id: idActual++,
                name,
                category,
                logo,
                href
            };

            canales.push(canal);
            document.getElementById("resultado").textContent = JSON.stringify(canales, null, 4);

            // Limpia campos menos el logo
            document.getElementById("name").value = "";
            document.getElementById("category").value = "";
            document.getElementById("href").value = "";
            document.getElementById("name").focus();
        }

        function reiniciar() {
            if (confirm("¿Estás seguro de reiniciar todos los datos?")) {
                canales = [];
                idActual = 1;
                document.getElementById("resultado").textContent = "[]";
            }
        }

        function copiarAlPortapapeles() {
            const texto = document.getElementById("resultado").textContent;
            navigator.clipboard.writeText(texto).then(() => {
                alert("Código copiado al portapapeles ✅");
            }).catch(err => {
                alert("Error al copiar: " + err);
            });
        }
    </script>

</body>
</html>
