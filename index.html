<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectando a la señal...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0a, #121212);
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .backdrop {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b1b1b 0%, #000 100%);
      z-index: 0;
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    .content h1 {
      font-size: 1.7rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .content p {
      font-size: 1rem;
      color: #bbbbbb;
      margin-bottom: 20px;
    }

    .signal-bar {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .bar {
      width: 4px;
      height: 20px;
      background: #1db954;
      border-radius: 2px;
      animation: bounce 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    iframe {
      display: none;
      width: 0;
      height: 0;
      border: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="backdrop"></div>

  <div class="content">
    <h1>Conectando a la transmisión en vivo</h1>
    <p>Preparando señal segura...</p>
    <div class="signal-bar">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <iframe id="embedFrame"></iframe>

  <script>
    const url = new URLSearchParams(window.location.search).get("url");
    const iframe = document.getElementById("embedFrame");

    if (url) {
      iframe.src = url;
    } else {
      document.querySelector("h1").textContent = "⚠️ Enlace no válido";
      document.querySelector("p").textContent = "Falta el parámetro ?url=";
    }
  </script>

</body>
</html>
