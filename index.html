<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #121212, #1c1c1c);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffffcc;
      z-index: 2;
    }

    .dot-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 6px solid transparent;
      border-top-color: #00bfff;
      animation: spin 1s linear infinite;
    }

    #videoFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">
      <div class="dot-spinner"></div>
      <p style="margin-top: 16px; font-size: 16px;">Cargando transmisión en vivo...</p>
    </div>
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>

  <script>
    // Ocultar el parámetro real y cargarlo internamente
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get("data");

    if (encoded) {
      try {
        const decodedUrl = atob(encoded); // Decodifica base64
        const iframe = document.getElementById('videoFrame');
        iframe.src = decodedUrl;
        iframe.onload = () => {
          // Mostrar el iframe después de cargar
          iframe.style.display = "block";
        };
      } catch (e) {
        document.getElementById('loading').innerHTML = "<p style='color:red;'>❌ Enlace inválido</p>";
      }
    } else {
      document.getElementById('loading').innerHTML = "<p style='color:red;'>❌ No se proporcionó enlace</p>";
    }
  </script>
</body>
</html>
