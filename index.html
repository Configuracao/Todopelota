<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Procesando video...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top: 6px solid #00bfff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
      color: #cccccc;
    }

    iframe {
      display: none; /* El iframe no es visible */
      width: 0;
      height: 0;
      border: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div>
    <div class="spinner"></div>
    <div id="status">Extrayendo video en vivo...</div>
  </div>

  <iframe id="embedFrame"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");

    if (url) {
      const iframe = document.getElementById("embedFrame");
      iframe.src = url;

      // Aquí puedes agregar lógica para extraer el video
      // Ej: comunicar con WebView/Android para interceptar la red
      // o usar ServiceWorker en apps web

      iframe.onload = () => {
        document.getElementById("status").textContent = "Procesando transmisión...";
        // Aquí podrías analizar contenido, scripts, esperar a capturar .m3u8, etc.
      };
    } else {
      document.getElementById("status").textContent = "❌ Enlace no válido.";
    }
  </script>

</body>
</html>
