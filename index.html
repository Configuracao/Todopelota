<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Transmisión en vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-color: #0e0f12;
      --accent-color: #1db954;
      --text-color: #ffffffd9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .loader-container {
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    .loader-ring {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top: 5px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loader-text {
      font-size: 17px;
      color: var(--text-color);
      letter-spacing: 0.5px;
    }

    iframe {
      display: none; /* oculto completamente */
      width: 0;
      height: 0;
      border: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="loader-ring"></div>
    <div class="loader-text">Cargando transmisión segura...</div>
  </div>

  <iframe id="embedFrame"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const embed = params.get("url");

    if (embed) {
      document.getElementById("embedFrame").src = embed;
      // Puedes aquí luego comunicarte con Android o usar ServiceWorker si es web
    } else {
      document.querySelector(".loader-text").textContent = "❌ Enlace no proporcionado";
    }
  </script>

</body>
</html>
