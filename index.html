<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciando transmisión...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0c0c0c;
      --accent: #1db954;
      --text: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .loader-box {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .title {
      font-size: 1.4rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 200px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    .progress-bar::before {
      content: "";
      position: absolute;
      height: 100%;
      width: 60px;
      background: var(--accent);
      animation: slide 1.5s infinite ease-in-out;
    }

    @keyframes slide {
      0%   { left: -60px; opacity: 0; }
      50%  { left: 80px; opacity: 1; }
      100% { left: 200px; opacity: 0; }
    }

    .message {
      color: #999;
      font-size: 0.95rem;
      margin-top: 15px;
    }

    iframe {
      display: none;
      width: 0;
      height: 0;
      border: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="loader-box">
    <div class="title">Conectando a la transmisión</div>
    <div class="progress-bar"></div>
    <div class="message">Por favor, espera unos segundos...</div>
  </div>

  <iframe id="embedFrame"></iframe>

  <script>
    const url = new URLSearchParams(window.location.search).get("url");
    const iframe = document.getElementById("embedFrame");

    if (url) {
      iframe.src = url;
    } else {
      document.querySelector(".title").textContent = "⚠️ Enlace no válido";
      document.querySelector(".message").textContent = "No se encontró el parámetro ?url=";
    }
  </script>

</body>
</html>
