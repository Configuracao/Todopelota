<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor</title>
  <style>
    body {
      margin: 0;
      background-color: #0e0e0e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #loader {
      position: absolute;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      animation: fadeIn 1s ease-in-out;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top: 6px solid #00bfff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Extrayendo el video...</p>
  </div>

  <iframe id="videoFrame" allowfullscreen></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");

    const iframe = document.getElementById("videoFrame");
    const loader = document.getElementById("loader");

    if (url) {
      iframe.src = url;
      iframe.onload = () => {
        // Puedes ocultar el loader si quieres después de cierta condición
        // Por ahora lo dejamos como infinito
        // loader.style.display = "none";
      };
    } else {
      loader.innerHTML = "<p style='color:red;'>❌ No se proporcionó un enlace válido</p>";
    }
  </script>

</body>
</html>
